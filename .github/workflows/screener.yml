name: Weekly Early Momentum Screener

# 排程已停用：Yahoo 對 GitHub Actions 出口 IP 限流，批次下載長期失敗。
# 正式執行改由本機 launchd（launchd/com.yanghaoyu.stock-screener.plist +
# run_screener.sh）每週六跑，結果 push 回 main。此 workflow 只留手動備援。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 批次下載後正常 ~10 分鐘；放寬上限容忍 Yahoo 限流慢速日

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # candidates 與 streak 兩份同日 CSV 都在（含 0 檔的空 CSV）且 ≤3 天
      # 才算本週已完成；只提交到一半的部分結果會讓補跑重跑整份
      - name: Check freshness of existing results
        id: fresh
        run: |
          skip=false
          latest=$(ls output/candidates_*.csv 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            file_date=$(basename "$latest" .csv | cut -d_ -f2)
            age_days=$(( ( $(date +%s) - $(date -d "$file_date" +%s) ) / 86400 ))
            if [ "$age_days" -le 3 ] && [ -f "output/streak_${file_date}.csv" ]; then
              skip=true
              echo "Results for $file_date already complete (${age_days}d old), skipping run."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run screener
        if: steps.fresh.outputs.skip != 'true'
        run: python main.py

      # always()：screener 後段（streak scan）失敗時，前段已寫出的
      # candidates CSV 仍要提交，避免有效結果被下游模組失敗吞掉；
      # job 本身仍以紅色收場，email 告警不受影響
      - name: Commit results
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "screener: $(date +'%Y-%m-%d') results"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 失敗告警：GitHub 預設會寄 email 給 repo owner（Actions 失敗通知），
      # 週六早上的敘事發酵 routine 也會偵測 CSV 過期並在報告中註明。
